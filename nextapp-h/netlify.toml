[build]
  command = "npm run build"
  publish = ".next"  
  functions = "netlify/functions"

# Use Next.js plugin for proper SSR and API routes
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: Redirect everything to Next.js routing system
[[redirects]]
  from = "/*"
  to = "/"
  status = 200
